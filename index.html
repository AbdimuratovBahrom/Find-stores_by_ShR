<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e40af"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" type="image/svg+xml">
  <link rel="shortcut icon" href="./images/tonder.jpg" type="image/x-icon">
  <link rel="stylesheet" href="./design-system.css">
  <link rel="stylesheet" href="./style.css">
  <title>Поиск схемы электропитания</title>
</head>
<body>
  <header class="ds-header">
    <span class="ds-header-title" id="headerTitle">⚡ ShR</span>
    <div class="ds-header-controls">
      <div class="ds-lang-group" role="group" aria-label="Til / Язык">
        <button type="button" class="ds-lang-btn active" data-lang="ru">RU</button>
        <button type="button" class="ds-lang-btn" data-lang="uz_latn">O'z</button>
        <button type="button" class="ds-lang-btn" data-lang="uz_cyrl">Ўз</button>
      </div>
      <button type="button" class="ds-theme-btn" id="themeToggle" aria-label="Переключить тему">🌙</button>
    </div>
  </header>

  <main class="ds-page">
    <h1 class="sr-only" id="title">Поиск схемы электропитания</h1>

    <section class="ds-card">
      <div class="search-wrapper">
        <div class="input-group">
          <div class="input-wrapper">
            <input type="text" id="searchInput" class="ds-search-input" placeholder="Введите ЩР, ШО, Ряд или номер магазина..." autocomplete="off">
            <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
          </div>
          <button class="search-btn ds-btn" onclick="performSearch()">Найти</button>
        </div>

        <div class="quick-actions" id="quickActions"></div>
      </div>
      <div id="recentSearches" class="ds-recent"></div>
    </section>

    <div id="resultsContainer"></div>
  </main>

  <div class="scheme">
    <a target="_blank" href="https://abdimuratovbahrom.github.io/tashkent-trade-center/">1,2,3 Блок</a>
  </div>

  <script src="./translations.js"></script>
  <script src="./script.js"></script>
</body>
</html>
