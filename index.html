<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="https://via.placeholder.com/32?text=⚡" type="image/x-icon">
  <link rel="shortcut icon" href="./images/tonder.jpg" type="image/x-icon">
  <link rel="stylesheet" href="./style.css">
  <title>Поиск схемы электропитания</title>
</head>
<body>
  <div class="theme-toggle" onclick="toggleTheme()"></div>

  <div class="container">
    <div class="lang-wrapper">
  <select id="langSelector" onchange="changeLanguage(this.value)">
    <option value="ru">Русский</option>
    <option value="uz_cyrl">Ўзбекча (Кирилл)</option>
    <option value="uz_latn">O'zbekcha (Lotin)</option>
  </select>
</div>

    <h1 id="title">⚡ Поиск схемы электропитания</h1>

    <div class="search-wrapper">
      <div class="input-group">
        <input type="text" id="searchInput" placeholder="Введите ЩР, ШО, Ряд или номер магазина..." autocomplete="off">
        <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
        <button class="search-btn" onclick="performSearch()">Найти</button>
      </div>

      <div class="quick-actions">
  <button class="chip-btn" onclick="addPrefixByLang('ЩР ', 'ShR ')">ShR / ЩР</button>
  <button class="chip-btn" onclick="addPrefixByLang('ШО-', 'ShO-')">ShO / ШО-</button>
  <button class="chip-btn" onclick="addPrefixByLang('Ряд ', 'Ryad ')">Ryad / Ряд</button>
</div>
    </div>

    <div id="resultsContainer"></div>
  </div>

  <div class="scheme">
    <a target="_blank" href="https://abdimuratovbahrom.github.io/tashkent-trade-center/">1,2,3 Блок</a>
  </div>

  <script src="./script.js"></script>
</body>
</html>
